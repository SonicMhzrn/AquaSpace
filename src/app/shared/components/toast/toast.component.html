<div class="pointer-events-none fixed z-[100] flex flex-col items-center gap-2 px-4"
  [ngClass]="{
    'inset-x-0 top-4 sm:top-6': position === 'top-center',
    'inset-x-0 bottom-4 sm:bottom-6': position === 'bottom-center',
    'right-4 top-4 items-end sm:top-6': position === 'top-right',
    'right-4 bottom-4 items-end sm:bottom-6': position === 'bottom-right'
  }" aria-live="polite">
  @for (toast of toastSvc.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex w-full max-w-sm items-center gap-3 rounded-xl border-2 px-4 py-3 shadow-[0_8px_30px_rgba(0,0,0,0.45)] ring-1 ring-black/10 transition opacity-100"
      style="background-color: #ffffff; background-image: linear-gradient(135deg, #ffffff, var(--toast-tint, #ffffff));"
      [ngClass]="{
        'border-tide-300 text-abyss-900': toast.type === ENUM_ToastType.Success,
        'border-red-300 text-red-700': toast.type === ENUM_ToastType.Error,
        'border-slate-200 text-slate-700': toast.type === ENUM_ToastType.Info
      }"
      [ngStyle]="{
        '--toast-tint': toast.type === ENUM_ToastType.Success ? '#ecfdf5' : toast.type === ENUM_ToastType.Error ? '#fef2f2' : '#f1f5f9'
      }">
      @if (toast.type === ENUM_ToastType.Success) {
        <svg class="h-5 w-5 shrink-0 text-tide-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      } @else if (toast.type === ENUM_ToastType.Error) {
        <svg class="h-5 w-5 shrink-0 text-red-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.9L2.6 17a1.5 1.5 0 0 0 1.3 2.3h16.2a1.5 1.5 0 0 0 1.3-2.3L13.7 3.9a1.5 1.5 0 0 0-2.6 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      } @else if (toast.type === ENUM_ToastType.Info) {
        <svg class="h-5 w-5 shrink-0 text-tide-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1" stroke-linecap="round"/></svg>
      }
      <p class="flex-1 text-sm font-medium">{{ toast.message }}</p>
      <button type="button" (click)="toastSvc.dismiss(toast.id)" class="text-slate-400 transition hover:text-slate-600" aria-label="Dismiss notification">
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5l10 10M15 5L5 15" stroke-linecap="round"/></svg>
      </button>
    </div>
  }
</div>
