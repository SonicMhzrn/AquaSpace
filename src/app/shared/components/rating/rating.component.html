<div class="flex items-center gap-1" [attr.aria-label]="value + ' out of 5 stars'">
  <div class="flex items-center" [class.text-sm]="size === 'sm'" [class.text-base]="size === 'md'">
    @for (star of stars(); track $index) {
      <svg [class.w-3.5]="size==='sm'" [class.h-3.5]="size==='sm'" [class.w-4]="size==='md'" [class.h-4]="size==='md'"
           viewBox="0 0 20 20" class="shrink-0" [class.text-tide-500]="star !== 'empty'" [class.text-slate-300]="star === 'empty'" fill="currentColor">
        @if (star === 'half') {
          <defs>
            <linearGradient [attr.id]="'half-' + $index">
              <stop offset="50%" stop-color="currentColor" />
              <stop offset="50%" stop-color="transparent" stop-opacity="1" />
            </linearGradient>
          </defs>
        }
        <path d="M10 1.5l2.6 5.27 5.82.85-4.21 4.1.99 5.8L10 14.9l-5.2 2.62.99-5.8-4.21-4.1 5.82-.85L10 1.5z" [attr.fill]="star === 'half' ? ('url(#half-' + $index + ')') : 'currentColor'" />
      </svg>
    }
  </div>
  @if (count !== undefined) {
    <span class="text-xs text-slate-500">({{ count }})</span>
  }
</div>
