<aside class="flex h-full w-64 flex-col bg-abyss-950 text-slate-300">
  <div class="flex items-center gap-2 px-5 py-5">
    <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-tide-gradient text-white">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2 12s3.5-5.5 9-5.5c3 0 6.5 1.7 9 4.2.7.6.7 1.6 0 2.2-2.5 2.5-6 4.1-9 4.1-5.5 0-9-5-9-5z" />
      </svg>
    </span>
    <div>
      <p class="font-display text-base font-semibold text-white">AquaShop</p>
      <p class="text-[11px] uppercase tracking-wide text-tide-400">Admin Panel</p>
    </div>
  </div>

  <nav class="flex-1 space-y-1 overflow-y-auto px-3 pb-6">
    @for (item of navItems; track item.link) {
    <a [routerLink]="item.link" routerLinkActive="bg-tide-600/20 text-white"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-300 transition hover:bg-white/5 hover:text-white">

      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-white/5">
        <lucide-icon [img]="item.icon" class="h-4 w-4">
        </lucide-icon>
      </span>

      {{ item.label }}

    </a>

    }

  </nav>

  <div class="border-t border-white/10 p-4">
    <a routerLink="/"
      class="flex items-center gap-2 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-400 transition hover:bg-white/5 hover:text-white">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      Back to Store
    </a>
  </div>
</aside>
