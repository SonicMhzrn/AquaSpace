<div
  class="group relative w-full select-none overflow-hidden bg-abyss-950"
  [class.rounded-3xl]="rounded"
  [style.aspect-ratio]="aspectRatio"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  (touchstart)="onTouchStart($event)"
  (touchmove)="onTouchMove($event)"
  (touchend)="onTouchEnd()"
>
  @if (slides.length > 0) {
    <!-- sliding track -->
    <div
      #track
      class="flex h-full w-full transition-transform duration-500 ease-out"
      [style.transform]="'translateX(-' + (activeIndex() * 100) + '%)'"
    >
      @for (slide of slides; track $index) {
        <div class="relative h-full w-full shrink-0">
          <img
            [src]="slide.image"
            [alt]="slide.alt ?? ''"
            loading="lazy"
            class="h-full w-full object-cover"
          />
          @if (slide.caption) {
            <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-abyss-950/85 to-transparent px-5 py-4 sm:px-8 sm:py-6">
              <p class="font-display text-sm font-semibold text-white sm:text-base">{{ slide.caption }}</p>
            </div>
          }
        </div>
      }
    </div>

    @if (slides.length > 1) {
      <!-- prev / next arrows -->
      <button
        type="button"
        (click)="prev()"
        class="absolute left-3 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-white/10 text-white opacity-0 backdrop-blur transition-opacity duration-300 hover:bg-white/20 group-hover:opacity-100 focus-visible:opacity-100"
        aria-label="Previous slide"
      >
        <svg class="h-5 w-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 4l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button
        type="button"
        (click)="next()"
        class="absolute right-3 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-white/10 text-white opacity-0 backdrop-blur transition-opacity duration-300 hover:bg-white/20 group-hover:opacity-100 focus-visible:opacity-100"
        aria-label="Next slide"
      >
        <svg class="h-5 w-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 4l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <!-- dot navigation -->
      <div class="absolute inset-x-0 bottom-3 flex items-center justify-center gap-1.5">
        @for (slide of slides; track $index) {
          <button
            type="button"
            (click)="goTo($index)"
            class="h-1.5 rounded-full transition-all duration-300"
            [ngClass]="activeIndex() === $index ? 'w-5 bg-tide-400' : 'w-1.5 bg-white/40'"
            [attr.aria-label]="'Go to slide ' + ($index + 1)"
            [attr.aria-current]="activeIndex() === $index ? 'true' : null"
          ></button>
        }
      </div>
    }
  }
</div>
