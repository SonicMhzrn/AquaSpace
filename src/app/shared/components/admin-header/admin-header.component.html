<header class="flex items-center gap-4 border-b border-slate-100 bg-white px-4 py-3.5 sm:px-6">
  <button type="button" (click)="menuToggle.emit()" class="text-slate-500 lg:hidden" aria-label="Open admin menu">
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg>
  </button>

  <h1 class="font-display text-lg font-semibold text-abyss-900">Admin Panel</h1>

  <div class="ml-auto flex items-center gap-3">
    @if (inventorySvc.lowStockCount() + inventorySvc.outOfStockCount() > 0) {
      <a routerLink="/admin/inventory" class="hidden items-center gap-1.5 rounded-full bg-amber-50 px-3 py-1.5 text-xs font-semibold text-amber-700 sm:flex">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.9L2.6 17a1.5 1.5 0 0 0 1.3 2.3h16.2a1.5 1.5 0 0 0 1.3-2.3L13.7 3.9a1.5 1.5 0 0 0-2.6 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        {{ inventorySvc.lowStockCount() + inventorySvc.outOfStockCount() }} stock alerts
      </a>
    }
    <div class="flex items-center gap-2.5 rounded-xl bg-slate-50 px-3 py-1.5">
      @if (authSvc.session()?.avatar) {
        <img [src]="authSvc.session()?.avatar" alt="" class="h-7 w-7 rounded-full object-cover" />
      } @else {
        <span class="flex h-7 w-7 items-center justify-center rounded-full bg-tide-gradient text-xs font-bold text-white">
          {{ authSvc.session()?.firstName?.charAt(0) }}
        </span>
      }
      <span class="hidden text-sm font-medium text-abyss-900 sm:inline">{{ authSvc.session()?.firstName }}</span>
      <button type="button" (click)="logout()" class="text-slate-400 transition hover:text-red-500" aria-label="Logout">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</header>
