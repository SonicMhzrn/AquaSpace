<div class="relative w-full">
  <form (ngSubmit)="submit()" class="relative">
    <svg class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="M17 17l-3.5-3.5" stroke-linecap="round"/></svg>
    <input type="search" [(ngModel)]="query" name="q" (input)="onInput()" (focus)="onFocus()" (blur)="close()"
      placeholder="Search fish, tanks, filters, and more…"
      class="w-full rounded-xl border border-slate-200 bg-white py-2.5 pl-10 pr-4 text-sm text-abyss-900 placeholder:text-slate-400 transition focus:border-tide-400 focus:outline-none focus:ring-2 focus:ring-tide-200" />
  </form>

  @if (isOpen() && searchSvc.suggestions().length > 0) {
    <div class="absolute z-30 mt-2 w-full overflow-hidden rounded-xl border border-slate-100 bg-white shadow-deep">
      @for (s of searchSvc.suggestions(); track s.label) {
        <a [routerLink]="s.routerLink" (click)="selectSuggestion()"
          class="flex items-center gap-3 px-4 py-2.5 text-sm transition hover:bg-tide-50">
          @if (s.image) {
            <img [src]="s.image" [alt]="s.label" class="h-8 w-8 rounded-lg object-cover" />
          } @else {
            <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-tide-50 text-tide-600">#</span>
          }
          <span class="flex-1 text-abyss-900">{{ s.label }}</span>
          <span class="text-xs uppercase tracking-wide text-slate-400">{{ s.type }}</span>
        </a>
      }
    </div>
  } @else if (isOpen() && query.trim()) {
    <div class="absolute z-30 mt-2 w-full rounded-xl border border-slate-100 bg-white p-4 text-sm text-slate-500 shadow-deep">
      No results for "{{ query }}"
    </div>
  }
</div>
