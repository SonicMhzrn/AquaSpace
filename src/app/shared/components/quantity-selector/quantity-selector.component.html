<div class="inline-flex items-center rounded-xl border border-slate-200 bg-white">
  <button type="button" (click)="decrement()" [disabled]="value <= min"
    class="flex h-9 w-9 items-center justify-center rounded-l-xl text-slate-500 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40"
    aria-label="Decrease quantity">
    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10h12" stroke-linecap="round"/></svg>
  </button>
  <input type="number" [ngModel]="value" (ngModelChange)="onInput($event)" [min]="min" [max]="max"
    class="h-9 w-12 border-x border-slate-200 text-center text-sm font-medium text-abyss-900 focus:outline-none"
    aria-label="Quantity" />
  <button type="button" (click)="increment()" [disabled]="value >= max"
    class="flex h-9 w-9 items-center justify-center rounded-r-xl text-slate-500 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40"
    aria-label="Increase quantity">
    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4v12M4 10h12" stroke-linecap="round"/></svg>
  </button>
</div>
