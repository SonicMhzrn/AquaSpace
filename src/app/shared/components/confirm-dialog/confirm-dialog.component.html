@if (dialogSvc.pending(); as req) {
  <div class="fixed inset-0 z-[110] flex items-center justify-center bg-abyss-950/60 px-4 backdrop-blur-sm" role="dialog" aria-modal="true">
    <div class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-deep">
      <h3 class="font-display text-lg font-semibold text-abyss-900">{{ req.title }}</h3>
      <p class="mt-2 text-sm text-slate-500">{{ req.message }}</p>
      <div class="mt-6 flex justify-end gap-3">
        <button type="button" (click)="dialogSvc.resolve(false)"
          class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-50">
          {{ req.cancelLabel ?? 'Cancel' }}
        </button>
        <button type="button" (click)="dialogSvc.resolve(true)"
          [class]="req.danger ? 'bg-red-600 hover:bg-red-700' : 'bg-tide-gradient hover:shadow-glow'"
          class="rounded-xl px-4 py-2 text-sm font-semibold text-white shadow-lg transition">
          {{ req.confirmLabel ?? 'Confirm' }}
        </button>
      </div>
    </div>
  </div>
}
