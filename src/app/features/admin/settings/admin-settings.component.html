<div class="max-w-3xl space-y-6">
  <h1 class="font-display text-2xl font-semibold text-abyss-900">Store Settings</h1>

  <div class="flex gap-6 border-b border-slate-200">
    <button type="button" (click)="activeTab = 'store'" [class.text-tide-600]="activeTab === 'store'" [class.border-tide-600]="activeTab === 'store'" class="border-b-2 border-transparent pb-3 text-sm font-semibold text-slate-500">Store</button>
    <button type="button" (click)="activeTab = 'commerce'" [class.text-tide-600]="activeTab === 'commerce'" [class.border-tide-600]="activeTab === 'commerce'" class="border-b-2 border-transparent pb-3 text-sm font-semibold text-slate-500">Commerce</button>
    <button type="button" (click)="activeTab = 'social'" [class.text-tide-600]="activeTab === 'social'" [class.border-tide-600]="activeTab === 'social'" class="border-b-2 border-transparent pb-3 text-sm font-semibold text-slate-500">Social Media</button>
    <button type="button" (click)="activeTab = 'general'" [class.text-tide-600]="activeTab === 'general'" [class.border-tide-600]="activeTab === 'general'" class="border-b-2 border-transparent pb-3 text-sm font-semibold text-slate-500">General</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-100">
    @if (activeTab === 'store') {
      <div class="space-y-4">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-abyss-900">Store Name</label>
          <input type="text" formControlName="storeName" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="mb-1.5 block text-sm font-medium text-abyss-900">Email</label>
            <input type="email" formControlName="email" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
          </div>
          <div>
            <label class="mb-1.5 block text-sm font-medium text-abyss-900">Phone</label>
            <input type="tel" formControlName="phone" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
          </div>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-abyss-900">Address</label>
          <input type="text" formControlName="address" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-abyss-900">Business Hours</label>
          <input type="text" formControlName="businessHours" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
        </div>
      </div>
    }

    @if (activeTab === 'commerce') {
      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="mb-1.5 block text-sm font-medium text-abyss-900">Currency Code</label>
            <input type="text" formControlName="currency" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
          </div>
          <div>
            <label class="mb-1.5 block text-sm font-medium text-abyss-900">Currency Symbol</label>
            <input type="text" formControlName="currencySymbol" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
          </div>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-abyss-900">Tax Rate (%)</label>
          <input type="number" step="0.1" formControlName="taxRatePercent" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="mb-1.5 block text-sm font-medium text-abyss-900">Shipping Fee</label>
            <input type="number" step="0.01" formControlName="shippingFee" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
          </div>
          <div>
            <label class="mb-1.5 block text-sm font-medium text-abyss-900">Free Shipping Threshold</label>
            <input type="number" step="0.01" formControlName="freeShippingThreshold" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
          </div>
        </div>
      </div>
    }

    @if (activeTab === 'social') {
      <div class="space-y-4">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-abyss-900">Facebook</label>
          <input type="text" formControlName="facebook" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-abyss-900">Instagram</label>
          <input type="text" formControlName="instagram" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-abyss-900">YouTube</label>
          <input type="text" formControlName="youtube" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-abyss-900">TikTok</label>
          <input type="text" formControlName="tiktok" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
        </div>
      </div>
    }

    @if (activeTab === 'general') {
      <div class="space-y-4">
        <label class="flex items-center justify-between rounded-xl border border-slate-200 p-4">
          <span class="text-sm font-medium text-abyss-900">Maintenance Mode</span>
          <input type="checkbox" formControlName="maintenanceMode" class="h-5 w-5 rounded border-slate-300 text-tide-600 focus:ring-tide-400" />
        </label>
        <label class="flex items-center justify-between rounded-xl border border-slate-200 p-4">
          <span class="text-sm font-medium text-abyss-900">Registration Enabled</span>
          <input type="checkbox" formControlName="registrationEnabled" class="h-5 w-5 rounded border-slate-300 text-tide-600 focus:ring-tide-400" />
        </label>
        <label class="flex items-center justify-between rounded-xl border border-slate-200 p-4">
          <span class="text-sm font-medium text-abyss-900">Reviews Enabled</span>
          <input type="checkbox" formControlName="reviewsEnabled" class="h-5 w-5 rounded border-slate-300 text-tide-600 focus:ring-tide-400" />
        </label>
        <label class="flex items-center justify-between rounded-xl border border-slate-200 p-4">
          <span class="text-sm font-medium text-abyss-900">Wishlist Enabled</span>
          <input type="checkbox" formControlName="wishlistEnabled" class="h-5 w-5 rounded border-slate-300 text-tide-600 focus:ring-tide-400" />
        </label>
      </div>
    }

    <div class="mt-6 flex justify-end border-t border-slate-100 pt-4">
      <button type="submit" class="rounded-xl bg-tide-gradient px-6 py-2.5 text-sm font-semibold text-white shadow transition hover:shadow-glow">Save Settings</button>
    </div>
  </form>
</div>
