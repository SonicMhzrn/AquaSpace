<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="font-display text-2xl font-semibold text-abyss-900">Blog</h1>
    <button type="button" (click)="openAdd()" class="inline-flex items-center gap-2 rounded-xl bg-tide-gradient px-4 py-2.5 text-sm font-semibold text-white shadow transition hover:shadow-glow">
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4v12M4 10h12" stroke-linecap="round"/></svg>
      Add Article
    </button>
  </div>

  <div class="overflow-x-auto rounded-2xl bg-white shadow-sm ring-1 ring-slate-100">
    <table class="w-full min-w-[700px] text-left text-sm">
      <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-400">
        <tr>
          <th class="px-4 py-3 font-medium">Article</th>
          <th class="px-4 py-3 font-medium">Category</th>
          <th class="px-4 py-3 font-medium">Author</th>
          <th class="px-4 py-3 font-medium">Published</th>
          <th class="px-4 py-3 font-medium">Status</th>
          <th class="px-4 py-3 font-medium text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (p of blogSvc.posts(); track p.id) {
          <tr class="transition hover:bg-slate-50">
            <td class="px-4 py-3">
              <div class="flex items-center gap-3">
                <img [src]="p.image" [alt]="p.title" class="h-9 w-9 rounded-lg object-cover" />
                <span class="line-clamp-1 font-medium text-abyss-900">{{ p.title }}</span>
              </div>
            </td>
            <td class="px-4 py-3 text-slate-500">{{ p.category }}</td>
            <td class="px-4 py-3 text-slate-500">{{ p.author }}</td>
            <td class="px-4 py-3 text-slate-500">{{ p.publishedDate | date: 'mediumDate' }}</td>
            <td class="px-4 py-3">
              <button type="button" (click)="togglePublish(p)" class="rounded-full px-2.5 py-1 text-xs font-semibold" [class.bg-tide-50]="p.status === 'Published'" [class.text-tide-700]="p.status === 'Published'" [class.bg-slate-100]="p.status !== 'Published'" [class.text-slate-500]="p.status !== 'Published'">
                {{ p.status }}
              </button>
            </td>
            <td class="px-4 py-3 text-right">
              <div class="flex justify-end gap-2">
                <button type="button" (click)="openEdit(p)" class="rounded-lg p-2 text-slate-400 transition hover:bg-slate-100 hover:text-tide-600" aria-label="Edit">
                  <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
                </button>
                <button type="button" (click)="remove(p)" class="rounded-lg p-2 text-slate-400 transition hover:bg-red-50 hover:text-red-500" aria-label="Delete">
                  <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7h12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-.8 12.2A2 2 0 0 1 14.2 21H9.8a2 2 0 0 1-2-1.8L7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  @if (showForm()) {
    <div class="fixed inset-0 z-[90] flex items-center justify-center bg-abyss-950/60 px-4 backdrop-blur-sm" role="dialog" aria-modal="true">
      <div class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-2xl bg-white p-6 shadow-deep">
        <h2 class="font-display text-lg font-semibold text-abyss-900">{{ editingId() ? 'Edit Article' : 'Add Article' }}</h2>
        <form [formGroup]="form" (ngSubmit)="save()" class="mt-4 space-y-4">
          <input type="text" formControlName="title" placeholder="Title" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
          <input type="text" formControlName="slug" placeholder="Slug" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
          <textarea formControlName="description" rows="2" placeholder="Short description" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none"></textarea>
          <textarea formControlName="content" rows="5" placeholder="Full content" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none"></textarea>
          <input type="text" formControlName="image" placeholder="Image URL" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
          <div class="grid grid-cols-2 gap-3">
            <input type="text" formControlName="category" placeholder="Category" class="rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
            <input type="text" formControlName="author" placeholder="Author" class="rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <input type="date" formControlName="publishedDate" class="rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
            <input type="text" formControlName="tags" placeholder="Tags (comma separated)" class="rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />
          </div>
          <div class="flex justify-end gap-3 pt-2">
            <button type="button" (click)="cancel()" class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-50">Cancel</button>
            <button type="submit" class="rounded-xl bg-tide-gradient px-5 py-2.5 text-sm font-semibold text-white shadow transition hover:shadow-glow">Save</button>
          </div>
        </form>
      </div>
    </div>
  }
</div>
