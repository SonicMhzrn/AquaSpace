<div class="space-y-6">
  <h1 class="font-display text-2xl font-semibold text-abyss-900">Reviews</h1>

  <input type="search" [ngModel]="search()" (ngModelChange)="search.set($event)" placeholder="Search by customer or product…"
    class="w-full max-w-md rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none" />

  <div class="space-y-3">
    @for (r of filtered(); track r.id) {
      <div class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-100">
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="text-xs font-medium uppercase tracking-wide text-tide-600">{{ productName(r.productId) }}</p>
            <div class="mt-1 flex items-center gap-2">
              <app-rating [value]="r.rating" size="md" />
              @if (r.verifiedPurchase) { <span class="text-xs font-medium text-tide-600">Verified Purchase</span> }
            </div>
            <h3 class="mt-2 text-sm font-semibold text-abyss-900">{{ r.title }}</h3>
            <p class="mt-1 text-sm text-slate-600">{{ r.comment }}</p>
            <p class="mt-2 text-xs text-slate-400">{{ r.customerName }} · {{ r.createdAt | date: 'mediumDate' }}</p>
          </div>
          <button type="button" (click)="remove(r.id)" class="shrink-0 rounded-lg p-2 text-slate-400 transition hover:bg-red-50 hover:text-red-500" aria-label="Delete review">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7h12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-.8 12.2A2 2 0 0 1 14.2 21H9.8a2 2 0 0 1-2-1.8L7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    }
    @if (filtered().length === 0) {
      <p class="py-10 text-center text-sm text-slate-400">No reviews match your search.</p>
    }
  </div>
</div>
