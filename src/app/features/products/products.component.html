<div class="min-h-screen w-full space-y-16 bg-slate-50 px-4 py-8 sm:px-6 lg:px-8 lg:py-12">
  <app-breadcrumb [items]="[{ label: 'All Products' }]" />

  <div class="mt-4 mb-8">
    <h1 class="font-display text-3xl font-semibold text-abyss-900">All Products</h1>
    <p class="mt-1 text-sm text-slate-500">{{ allResults().length }} product{{ allResults().length === 1 ? '' : 's' }} found</p>
  </div>

  <div class="grid grid-cols-1 gap-8 lg:grid-cols-4">
    <!-- filters -->
    <aside class="space-y-6 lg:col-span-1">
      <div class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-100">
        <label class="mb-2 block text-sm font-semibold text-abyss-900">Search</label>
        <input type="search" [(ngModel)]="search" (ngModelChange)="runSearch()" placeholder="Search products…"
          class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none focus:ring-2 focus:ring-tide-200" />
      </div>

      <div class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-100">
        <h3 class="mb-3 text-sm font-semibold text-abyss-900">Price Range</h3>
        <div class="flex items-center gap-2">
          <input type="number" [(ngModel)]="minPrice" (ngModelChange)="runSearch()" placeholder="Min"
            class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-tide-400 focus:outline-none" />
          <span class="text-slate-400">–</span>
          <input type="number" [(ngModel)]="maxPrice" (ngModelChange)="runSearch()" placeholder="Max"
            class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-tide-400 focus:outline-none" />
        </div>
      </div>

      <div class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-100">
        <h3 class="mb-3 text-sm font-semibold text-abyss-900">Brand</h3>
        <div class="max-h-48 space-y-2 overflow-y-auto pr-1">
          @for (brand of availableBrands(); track brand) {
            <label class="flex items-center gap-2 text-sm text-slate-600">
              <input type="checkbox" [checked]="selectedBrands.has(brand)" (change)="toggleBrand(brand)"
                class="h-4 w-4 rounded border-slate-300 text-tide-600 focus:ring-tide-400" />
              {{ brand }}
            </label>
          }
        </div>
      </div>

      <div class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-100">
        <h3 class="mb-3 text-sm font-semibold text-abyss-900">Minimum Rating</h3>
        <select [(ngModel)]="minRating" (ngModelChange)="runSearch()"
          class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-tide-400 focus:outline-none">
          <option [ngValue]="undefined">Any rating</option>
          <option [ngValue]="4">4 stars & up</option>
          <option [ngValue]="4.5">4.5 stars & up</option>
        </select>
      </div>

      <div class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-100">
        <label class="flex items-center gap-2 text-sm font-medium text-abyss-900">
          <input type="checkbox" [(ngModel)]="inStockOnly" (ngModelChange)="runSearch()"
            class="h-4 w-4 rounded border-slate-300 text-tide-600 focus:ring-tide-400" />
          In stock only
        </label>
      </div>

      <button type="button" (click)="clearFilters()" class="w-full rounded-xl border border-slate-200 py-2.5 text-sm font-semibold text-slate-500 transition hover:bg-slate-50">
        Clear Filters
      </button>
    </aside>

    <!-- results -->
    <div class="lg:col-span-3">
      <div class="mb-5 flex items-center justify-end">
        <select [(ngModel)]="sortBy" (ngModelChange)="runSearch()"
          class="rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none">
          <option value="newest">Newest</option>
          <option value="popular">Most Popular</option>
          <option value="rating">Top Rated</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
        </select>
      </div>

      <app-product-grid [products]="pagedResults()" [loading]="loading" emptyTitle="No products match your filters" emptyDescription="Try clearing filters or searching a different term." />

      <div class="mt-8">
        <app-pagination [currentPage]="currentPage()" [totalPages]="totalPages()" (pageChange)="onPageChange($event)" />
      </div>
    </div>
  </div>
</div>
