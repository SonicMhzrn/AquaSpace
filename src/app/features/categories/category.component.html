@if (category) {
  <div>
    <!-- category banner -->
    <div class="relative h-56 w-full overflow-hidden bg-abyss-950 sm:h-64">
      <img [src]="category.image" [alt]="category.name" class="h-full w-full object-cover opacity-40" />
      <div class="absolute inset-0 bg-gradient-to-t from-abyss-950 via-abyss-950/60 to-transparent"></div>
      <div class="absolute inset-0 flex items-end">
        <div class="mx-auto w-full max-w-7xl px-4 pb-8 sm:px-6 lg:px-8">
          <app-breadcrumb [items]="parentCategory ? [{ label: parentCategory.name, link: ['/category', parentCategory.slug] }, { label: category.name }] : [{ label: category.name }]" />
          <h1 class="mt-3 font-display text-3xl font-semibold text-white sm:text-4xl">{{ category.name }}</h1>
          <p class="mt-2 max-w-2xl text-sm text-slate-300">{{ category.description }}</p>
        </div>
      </div>
    </div>

    <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      <!-- subcategory chips -->
      @if (subcategories.length > 0) {
        <div class="mb-8 flex flex-wrap gap-2">
          <button type="button" (click)="filterBySubcategory(undefined)"
            [class]="!activeSubcategorySlug ? 'bg-tide-gradient text-white shadow-glow' : 'bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50'"
            class="rounded-full px-4 py-2 text-sm font-medium transition">
            All {{ category.name }}
          </button>
          @for (sub of subcategories; track sub.id) {
            <button type="button" (click)="filterBySubcategory(sub.slug)"
              [class]="activeSubcategorySlug === sub.slug ? 'bg-tide-gradient text-white shadow-glow' : 'bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50'"
              class="rounded-full px-4 py-2 text-sm font-medium transition">
              {{ sub.name }}
            </button>
          }
        </div>
      }

      <div class="mb-5 flex items-center justify-between">
        <p class="text-sm text-slate-500">{{ allResults().length }} product{{ allResults().length === 1 ? '' : 's' }}</p>
        <select [(ngModel)]="sortBy" (ngModelChange)="onSortChange()"
          class="rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm focus:border-tide-400 focus:outline-none">
          <option value="newest">Newest</option>
          <option value="popular">Most Popular</option>
          <option value="rating">Top Rated</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
        </select>
      </div>

      <app-product-grid [products]="pagedResults()" [loading]="loading" emptyTitle="No products in this category yet" emptyDescription="Check back soon, or browse another category." />

      <div class="mt-8">
        <app-pagination [currentPage]="currentPage()" [totalPages]="totalPages()" (pageChange)="onPageChange($event)" />
      </div>
    </div>
  </div>
} @else if (!loading) {
  <div class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
    <app-empty-state icon="error" title="Category not found" description="This category may have been removed or renamed." actionLabel="Browse All Products" [actionLink]="['/products']" />
  </div>
}
