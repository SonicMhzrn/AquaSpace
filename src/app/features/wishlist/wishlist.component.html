<div class="mx-auto max-w-5xl px-4 py-10 sm:px-6 lg:px-8">
  <h1 class="font-display text-3xl font-semibold text-abyss-900">Your Wishlist</h1>

  @if (wishlistSvc.items().length === 0) {
    <div class="mt-10">
      <app-empty-state icon="heart" title="Your wishlist is empty" description="Save products you love to find them here later." actionLabel="Browse Products" [actionLink]="['/products']" />
    </div>
  } @else {
    <div class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (item of wishlistSvc.items(); track item.productId) {
        <div class="flex flex-col overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-100">
          <a [routerLink]="['/product', item.productId]" class="aspect-square overflow-hidden bg-slate-50">
            <img [src]="item.image" [alt]="item.name" class="h-full w-full object-cover transition hover:scale-105" />
          </a>
          <div class="flex flex-1 flex-col p-4">
            <a [routerLink]="['/product', item.productId]" class="line-clamp-2 font-display text-sm font-semibold text-abyss-900 hover:text-tide-600">{{ item.name }}</a>
            <p class="mt-1 text-base font-bold text-abyss-900">{{ item.price | currency:'INR':'Rs. ' }}</p>
            <div class="mt-auto flex gap-2 pt-4">
              <button type="button" (click)="moveToCart(item.productId)" class="flex-1 rounded-xl bg-tide-gradient py-2 text-xs font-semibold text-white shadow transition hover:shadow-glow">Move to Cart</button>
              <button type="button" (click)="remove(item.productId)" class="flex h-9 w-9 items-center justify-center rounded-xl border border-slate-200 text-slate-400 transition hover:text-red-500" aria-label="Remove">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5l10 10M15 5L5 15" stroke-linecap="round"/></svg>
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  }
</div>
